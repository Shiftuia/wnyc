# Ingress sidecar: the ONLY container on both Traefik's `proxy` network and the internal wnyc network.
# Traefik reaches it on :8080; it forwards to the app and nowhere else, so the app container has no route
# to Traefik (and through Traefik to every other backend on this host).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  server_tokens off;
  # no access log: request lines carry visitor questions in ?q= links and addresses in /api/geocode?q=
  access_log off;

  # Visitor identity for limits: Cloudflare's CF-Connecting-IP (set by Cloudflare, overwritten on every
  # request through the tunnel), else the TCP peer. Sent to the app as X-WNYC-Client, replacing any value
  # the client supplied.
  map $http_cf_connecting_ip $wnyc_client { "" $remote_addr; default $http_cf_connecting_ip; }
  # Scheme the browser used (Cloudflare terminates TLS; Traefik forwards its X-Forwarded-Proto only from the
  # trusted proxy bridge). Normalised to http|https so the app can build https:// URLs in /basemap/style.json.
  map $http_x_forwarded_proto $wnyc_proto { default "http"; "https" "https"; }
  limit_req_zone  $wnyc_client zone=web:10m  rate=600r/m;
  limit_req_zone  $wnyc_client zone=api:10m  rate=60r/m;
  limit_req_zone  $wnyc_client zone=ask:10m  rate=6r/m;
  limit_conn_zone $wnyc_client zone=conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  client_max_body_size 8k;
  client_body_timeout 10s;
  client_header_timeout 10s;
  large_client_header_buffers 4 8k;

  upstream app { server wnyc:8765; keepalive 8; }

  server {
    listen 8080;
    limit_conn conn 24;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-WNYC-Client $wnyc_client;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Proto $wnyc_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 180s;

    location = /nginx-health { access_log off; return 200 "ok\n"; }
    location = /api/ask { limit_req zone=ask burst=3 nodelay; proxy_buffering off; proxy_pass http://app; }
    location /api/ { limit_req zone=api burst=30 nodelay; proxy_pass http://app; }
    location / { limit_req zone=web burst=300 nodelay; proxy_pass http://app; }
  }
}
